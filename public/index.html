<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1a10">
<meta name="description" content="Dijital Mangala — binlerce yıllık Türk zekâ oyunu: botlar, çevrimiçi, dereceli, turnuva, bulmacalar.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Dijital Mangala</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="authscr">
<canvas id="fx"></canvas>
<div id="app">
  <div id="topbar">
    <button class="pchip" id="pchip"><span id="tb-av"></span><div><div class="nm" id="tb-name"></div><div class="lvl"><b id="tb-lvl">1</b><div class="xpbar"><i id="tb-xp"></i></div></div></div></button>
    <div class="row" style="gap:8px;flex-wrap:nowrap">
      <button class="iconbtn" id="musicbtn" title="Müzik">🎵</button>
      <button class="iconbtn" id="dailybtn" title="Günlük ödül">🎁</button>
      <div class="coins" id="coins">🪙 <b id="coinval">0</b></div>
    </div>
  </div>

  <section class="screen" id="scr-auth"></section>

  <section class="screen" id="scr-tutorial">
    <div class="tut-top"><b id="tut-lbl">🎓</b><div class="prog"><i id="tprog"></i></div><span class="muted" id="tstep"></span></div>
    <div class="side-lbl" id="tut-opp"></div>
    <div class="bwrap"><div id="tboard" class="board"></div><div class="handlayer"></div><div class="fxlayer"></div></div>
    <div class="side-lbl" id="tut-me"></div>
    <div class="tcard" id="tcard"></div>
  </section>

  <section class="screen" id="scr-menu"></section>
  <section class="screen" id="scr-mode"></section>
  <section class="screen" id="scr-bots"></section>
  <section class="screen" id="scr-puzzles"></section>
  <section class="screen" id="scr-online"></section>
  <section class="screen" id="scr-tour"></section>

  <section class="screen" id="scr-game">
    <div class="modebanner" id="g-banner" style="display:none"></div>
    <div class="puzzlebar" id="g-puzzle" style="display:none"></div>
    <div class="pbar" id="pb1"><span id="g-av1"></span><div style="min-width:0"><div class="nm" id="g-nm1"></div><div class="think" id="g-think"></div></div><div class="cards" id="g-cards1"></div><span class="sc" id="g-s1">0</span><div class="bubble" id="bub1"></div><div class="tbar" id="tb1"><i></i></div></div>
    <div class="gwrap bwrap"><div id="gboard" class="board"></div><div class="handlayer"></div><div class="fxlayer"></div></div>
    <div class="pbar" id="pb0"><span id="g-av0"></span><div style="min-width:0"><div class="nm" id="g-nm0"></div><div class="think" id="g-me"></div></div><div class="cards" id="g-cards0"></div><span class="sc" id="g-s0">0</span><div class="bubble" id="bub0"></div><div class="tbar" id="tb0"><i></i></div></div>
    <div id="gstatus"></div>
    <div class="chatbar" id="g-actions"></div>
    <div class="emopanel" id="emopanel"></div>
  </section>

  <section class="screen" id="scr-replay"></section>
  <section class="screen" id="scr-shop"></section>
  <section class="screen" id="scr-pass"></section>
  <section class="screen" id="scr-events"></section>
  <section class="screen" id="scr-profile"></section>
  <section class="screen" id="scr-rules"></section>
  <section class="screen" id="scr-settings"></section>
  <section class="screen" id="scr-admin"></section>
</div>
<div id="modal"></div>
<div id="toast"></div>
<div id="achpop"></div>
<canvas id="confetti"></canvas>
<script src="js/engine.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/app.js"></script>
<script src="js/play.js"></script>
</body>
</html>
